name: Bug report
description: Something in the port behaves wrong, on a console or in an emulator.
title: "[Bug] <zone> <act> <era>: <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. One bug per issue, please.
        **Do not attach or link disc images, BIOS files, built BIN/CUE/ISO files, save states or game data.** Issues that contain them are deleted.
        For a console test of a whole build, use the **Hardware test report** form instead.

  - type: input
    id: version
    attributes:
      label: Version (IP_VERSION)
      description: The `IP_VERSION` line in `Makefile`, for example `V0.078`. Add the commit hash if you built from an unreleased commit.
      placeholder: "V0.078 (commit 4269266)"
    validations:
      required: true

  - type: input
    id: bin_sha256
    attributes:
      label: BIN SHA-256
      description: "Run `shasum -a 256 dist/sonic-cd-saturn-prototype.bin` (macOS) or `sha256sum` (Linux). Paste the full 64-character hash."
      placeholder: "11b162218b49201b51cf9fc6d205844731c5bd49079abce76a6cc9347187f4a6"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Where did it happen?
      options:
        - Real Saturn + SAROO
        - Real Saturn + other ODE or CD-R
        - Beetle Saturn (libretro)
        - Mednafen
        - Other emulator (name it below)
    validations:
      required: true

  - type: input
    id: saroo_firmware
    attributes:
      label: SAROO firmware version
      description: Shown on the SAROO menu. Write "n/a" for an emulator.
      placeholder: "version from the SAROO menu, or n/a"
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: Saturn model, region and video mode (or emulator name and version)
      placeholder: "e.g. Model 2, Japan, NTSC 60 Hz, RGB / RetroArch Beetle Saturn <version>"
    validations:
      required: true

  - type: dropdown
    id: zone
    attributes:
      label: Zone
      options:
        - Palmtree Panic
        - Collision Chaos
        - Tidal Tempest
        - Quartz Quadrant
        - Wacky Workbench
        - Stardust Speedway
        - Metallic Madness
        - Special stage
        - Title / menus / Time Attack
        - Ending / movies
        - Not zone-specific
    validations:
      required: true

  - type: dropdown
    id: act
    attributes:
      label: Act
      options:
        - Act 1
        - Act 2
        - Act 3
        - Not act-specific
    validations:
      required: true

  - type: dropdown
    id: era
    attributes:
      label: Era
      options:
        - Present
        - Past
        - Good Future
        - Bad Future
        - Not era-specific
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from boot or from a named save. Give the route, inputs and where Sonic was.
      placeholder: |
        1. New Game, play to Collision Chaos Act 2 Present.
        2. Hit the second pinball flipper while rolling left.
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What the Sega CD original does
      description: If you checked the original game or scddisasm, say how.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What the port does
      description: Attach a photo or a short video if you can. Keep it to the bug.
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often?
      options:
        - Every time
        - Sometimes
        - Once
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Other notes
      description: Audio connection, earlier versions that worked, anything else.

  - type: checkboxes
    id: no_assets
    attributes:
      label: Confirmation
      options:
        - label: I did not attach disc images, BIOS or game data.
          required: true
